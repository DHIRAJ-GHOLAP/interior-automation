name: Render 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from sleeping (15 min inactivity timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging Render backend at $(date -u)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "https://interior-automation-backend.onrender.com/api/health")
          echo "HTTP Response Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Render backend is awake and healthy!"
          else
            echo "Wake-up signal transmitted (Status: $STATUS)."
          fi
