services:
  - type: web
    name: interior-automation-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_NIk2dKUDTX7R@ep-flat-credit-b4ehl9tu-pooler.c-6.us-east-2.aws.neon.tech/moreint?sslmode=require&channel_binding=require"
      - key: CORS_ORIGINS
        value: "https://more.gholap.xyz,https://gholap.xyz,http://localhost:5173,http://localhost:3000"
